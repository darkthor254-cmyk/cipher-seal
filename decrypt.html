<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decrypt a message — Cipher &amp; Seal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html" style="text-decoration:none; color:inherit;">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="18" stroke="var(--brass)" stroke-width="1.6"/>
        <circle cx="20" cy="20" r="12.5" stroke="var(--brass)" stroke-width="1" opacity="0.55"/>
        <path d="M20 12 L20 20 L25.5 24.5" stroke="var(--brass)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="20" r="1.6" fill="var(--brass)"/>
      </svg>
      <span class="brand-name">Cipher<em>&amp;</em>Seal</span>
    </a>
    <div class="topbar-right">
      <nav class="tabs" aria-label="Site sections">
        <a href="index.html">Home</a>
        <a href="encrypt.html">Encrypt</a>
        <a href="decrypt.html" class="active">Decrypt</a>
        <a href="about.html">About</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode" title="Toggle theme">🌙</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="page active" id="page-decrypt">
    <div class="panel-head">
      <div class="eyebrow">Decrypt</div>
      <h1>Open a sealed message</h1>
      <p>Paste the cipher text you were sent, enter the same secret key the sender used, and unlock it.</p>
    </div>

    <div class="card">
      <div class="field">
        <div class="field-label"><label for="decInput">Encrypted text</label></div>
        <textarea id="decInput" placeholder="Paste the cipher text here…"></textarea>
        <div class="row-actions">
          <button class="link-btn" id="pasteDecInput">📋 Paste from clipboard</button>
          <label class="link-btn" for="uploadTxt" style="cursor:pointer;">⬆ Upload .txt file</label>
          <input type="file" id="uploadTxt" accept=".txt" class="visually-hidden">
        </div>
      </div>

      <div class="field">
        <div class="field-label"><label for="decKey">Secret key</label></div>
        <div class="key-row">
          <input class="keyinput" id="decKey" type="password" placeholder="Same passphrase the sender used" autocomplete="off">
          <button class="icon-btn" id="decKeyToggle" aria-label="Show secret key" title="Show/hide">👁</button>
        </div>
      </div>

      <div class="action-row" style="margin-top:22px;">
        <button class="btn btn-primary btn-full" id="decryptBtn">Decrypt message</button>
      </div>

      <div class="status" id="decStatus"></div>

      <div class="output-block" id="decOutputBlock">
        <div class="output-head">
          <div class="field-label" style="margin:0;"><label>Original message</label></div>
          <span class="seal"><span class="dot"></span>verified</span>
        </div>
        <textarea id="decOutput" readonly></textarea>
        <div class="output-actions">
          <button class="small-btn" id="copyDecOutput">📋 Copy</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>cipher &amp; seal — encrypted locally, always</span>
    <span id="clockTag"></span>
  </div>
</footer>

<script src="js/utils.js"></script>
<script src="js/crypto.js"></script>
<script src="js/decrypt.js"></script>
</body>
</html>
